server {
    listen 80;
    server_name launch-it-corp.ru www.launch-it-corp.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name launch-it-corp.ru www.launch-it-corp.ru;

    ssl_certificate /etc/letsencrypt/live/launch-it-corp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launch-it-corp.ru/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /hubs/ {
        proxy_pass http://backend:80/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
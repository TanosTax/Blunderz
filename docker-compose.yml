services:
  postgres:
    image: postgres:16-alpine
    container_name: blunderz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chessdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blunderz_network

  backend:
    build:
      context: .
      dockerfile: ChessBackend/Dockerfile
    container_name: blunderz_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DefaultConnection=Host=postgres;Port=5432;Database=chessdb;Username=postgres;Password=postgres123
      - JWT_SECRET=super-secret-key-for-development-32chars
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blunderz_network

  frontend:
    build:
      context: .
      dockerfile: ChessFrontend/Dockerfile
    container_name: blunderz_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - blunderz_network

volumes:
  postgres_data:

networks:
  blunderz_network:
    driver: bridge